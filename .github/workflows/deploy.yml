# Publica la app en GitHub Pages (https://iagoestevez.com/LocalList/) al hacer
# push a main. INACTIVO hasta el cambio de la V1 a la V2:
#   1) Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2) Merge de v2-react en main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Sin scripts de instalación, igual que en local (npm 12 los bloquea):
      # ninguno hace falta y así ningún paquete ejecuta código al instalarse.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
