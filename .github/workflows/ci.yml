# Comprueba cada push y PR: tipos, lint, tests, build, tamaño y reglas de Firestore.
# NO despliega nada. El despliegue a GitHub Pages se añadirá aparte,
# y solo se activará cuando se apruebe el cambio de la V1 a la V2.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Sin scripts de instalación, igual que en local (npm 12 los bloquea):
      # ninguno hace falta y así ningún paquete ejecuta código al instalarse.
      - run: npm ci --ignore-scripts
      - run: npm run check

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # El emulador de Firestore necesita Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Sin scripts de instalación, igual que en local (npm 12 los bloquea):
      # ninguno hace falta y así ningún paquete ejecuta código al instalarse.
      - run: npm ci --ignore-scripts
      - run: npm run test:rules
