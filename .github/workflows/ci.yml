# Comprueba cada push y PR: tipos, lint, tests y build.
# NO despliega nada. El despliegue a GitHub Pages se añadirá aparte,
# y solo se activará cuando se apruebe el cambio de la V1 a la V2.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
