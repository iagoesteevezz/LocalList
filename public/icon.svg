<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- LocaLisT: tres renglones de lista escritos en tiza sobre la pizarra;
       el primero, ya cogido, tachado a mano (la firma de la app). -->
  <rect width="512" height="512" rx="112" fill="#1f3a2d"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Marcas: aro con check (cogido) y dos aros vacíos (pendientes) -->
    <circle cx="140" cy="168" r="34" fill="#f3f1e7" stroke="#f3f1e7" stroke-width="18"/>
    <path d="M124 169l12 12 22-25" stroke="#1f3a2d" stroke-width="16"/>
    <circle cx="140" cy="262" r="34" stroke="#f3f1e7" stroke-width="18"/>
    <circle cx="140" cy="356" r="34" stroke="#f3f1e7" stroke-width="18"/>
    <!-- Renglones -->
    <path d="M214 168h170" stroke="#f3f1e7" stroke-width="22" opacity="0.55"/>
    <path d="M214 262h178" stroke="#f3f1e7" stroke-width="22"/>
    <path d="M214 356h130" stroke="#f3f1e7" stroke-width="22"/>
    <!-- Tachado de tiza amarillo sobre el primer renglón -->
    <path d="M200 176c40-14 84-6 128-12s52-4 74-10" stroke="#f2d45c" stroke-width="16"/>
  </g>
</svg>
